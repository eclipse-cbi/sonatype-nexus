apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-xfs-retain
parameters:
  clusterID: rook-ceph-prod-external
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner-ceph-prod-rbd-production-cluster
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph-prod-external
  csi.storage.k8s.io/fstype: xfs
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node-ceph-prod-rbd-production-cluster
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph-prod-external
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner-ceph-prod-rbd-production-cluster
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph-prod-external
  imageFeatures: layering
  imageFormat: "2"
  pool: rbd-production-cluster
provisioner: rook-ceph.rbd.csi.ceph.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
